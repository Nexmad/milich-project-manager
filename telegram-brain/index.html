<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Telegram Brain</title>
<meta name="theme-color" content="#07111f" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#eef6ff;background:#06101d}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:radial-gradient(circle at 15% 10%,#143867 0,transparent 28%),radial-gradient(circle at 85% 85%,#0b6c8050 0,transparent 30%),#06101d;color:#eef6ff}button,input{font:inherit}.glass{background:linear-gradient(135deg,#ffffff14,#ffffff08);border:1px solid #ffffff18;box-shadow:0 20px 55px #0008;backdrop-filter:blur(18px)}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-card{width:min(430px,100%);border-radius:28px;padding:34px;text-align:center}.logo{font-size:54px}.muted{color:#8fa3bc}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#0004;padding:4px;border-radius:13px;margin:22px 0 14px}.tabs button{border:0;background:transparent;color:#8da0ba;padding:10px;border-radius:10px;cursor:pointer}.tabs button.active{background:#ffffff12;color:#fff}.form{display:grid;gap:10px}.input{width:100%;background:#06101a;border:1px solid #ffffff18;color:#fff;border-radius:13px;padding:13px;outline:none}.primary{border:0;background:linear-gradient(135deg,#1f97ff,#5458ff);color:#fff;padding:12px 17px;border-radius:13px;cursor:pointer}.notice{margin-top:13px;padding:11px;border-radius:10px;background:#ffffff0d;color:#d5e2f3;font-size:13px}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{margin:16px;border-radius:24px;padding:18px;position:sticky;top:16px;height:calc(100vh - 32px);display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:8px 6px 22px}.brand span{font-size:31px}.brand small{display:block;color:#7890ad}.nav{display:grid;gap:6px}.nav button,.logout{border:0;background:transparent;color:#9fb0c7;padding:12px 13px;border-radius:12px;cursor:pointer;text-align:right}.nav button.active,.nav button:hover{background:#1d93ff22;color:white}.logout{margin-top:auto;color:#ffadb7}.main{padding:28px 32px 100px;min-width:0}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:24px}.head h2{font-size:28px;margin:0 0 7px}.badge{background:#ffffff0d;border:1px solid #ffffff18;border-radius:999px;padding:8px 12px;color:#aebbd0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}.stat{border-radius:20px;padding:19px;display:grid;gap:8px}.stat b{font-size:29px}.stat small{color:#8fa0b7}.panel{border-radius:21px;padding:20px;margin-bottom:14px}.panel h3{margin-top:0}.row{padding:13px 0;border-bottom:1px solid #ffffff0c}.row:last-child{border:0}.row .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row .meta span{color:#68aff7;font-size:12px}.row p{margin:7px 0;color:#d3dfef;line-height:1.8}.row time{font-size:11px;color:#71859f}.search{display:grid;grid-template-columns:1fr auto;gap:10px}.cards{display:grid;gap:10px;margin-top:14px}.empty{text-align:center;padding:32px;color:#7f93ad}.table .item{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center;padding:15px;border-bottom:1px solid #ffffff0b}.table .item:last-child{border:0}.type{font-size:11px;color:#7890aa}.upload{padding:40px;text-align:center}.upload .big{font-size:44px}.file{display:inline-block;margin-top:12px}.file input{display:none}.progress{margin-top:16px;color:#b9c9dd}.check{display:flex;justify-content:center;gap:8px;align-items:center;margin:14px 0;color:#b8c7d8}.ok{color:#68e6ae}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:30;bottom:10px;top:auto;left:10px;right:10px;height:auto;margin:0;padding:8px;border-radius:18px}.brand,.logout{display:none}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.main{padding:22px 14px 94px}.stats{grid-template-columns:1fr 1fr}.head{display:block}.badge{display:inline-block;margin-top:10px}}@media(max-width:520px){.stats{grid-template-columns:1fr}.table .item{grid-template-columns:1fr auto}.table time{display:none}.upload{padding:26px 14px}}
</style>
</head>
<body>
<div id="auth" class="auth">
  <div class="auth-card glass">
    <div class="logo">🧠</div><h1>Telegram Brain</h1><div class="muted">حافظه هوشمند گفتگوهای تلگرام</div>
    <div class="tabs"><button id="signinTab" class="active">ورود</button><button id="signupTab">ساخت حساب</button></div>
    <form id="authForm" class="form"><input id="email" class="input" type="email" placeholder="ایمیل" required><input id="password" class="input" type="password" minlength="6" placeholder="رمز عبور" required><button id="authBtn" class="primary">ورود</button></form>
    <div id="authMsg" class="notice hidden"></div>
  </div>
</div>
<div id="app" class="app hidden">
  <aside class="side glass"><div class="brand"><span>🧠</span><div><b>Telegram Brain</b><small>Second Brain</small></div></div><div class="nav" id="nav"></div><button id="logout" class="logout">خروج</button></aside>
  <main class="main"><div id="content"></div></main>
</div>
<script>
const SB_URL='https://cohandrixpdthmpbxnsc.supabase.co';
const SB_KEY='sb_publishable_hPH1KRp-KM_RDY0pMwzT2w_SbF-jHjB';
const db=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let mode='signin',session=null,page='dashboard';
const pages=[['dashboard','داشبورد'],['search','جست‌وجو'],['chats','گفتگوها'],['import','ورود اطلاعات']];
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const fa=n=>Number(n||0).toLocaleString('fa-IR');
function setMode(m){mode=m;signinTab.classList.toggle('active',m==='signin');signupTab.classList.toggle('active',m==='signup');authBtn.textContent=m==='signin'?'ورود':'ساخت حساب';authMsg.classList.add('hidden')}
signinTab.onclick=()=>setMode('signin');signupTab.onclick=()=>setMode('signup');
authForm.onsubmit=async e=>{e.preventDefault();authBtn.disabled=true;authBtn.textContent='در حال انجام...';let r;if(mode==='signin')r=await db.auth.signInWithPassword({email:email.value,password:password.value});else r=await db.auth.signUp({email:email.value,password:password.value});if(r.error){authMsg.textContent=r.error.message;authMsg.classList.remove('hidden')}else if(mode==='signup'&&!r.data.session){authMsg.textContent='حساب ساخته شد. ایمیل تأیید را بررسی کن.';authMsg.classList.remove('hidden')}authBtn.disabled=false;authBtn.textContent=mode==='signin'?'ورود':'ساخت حساب'};
logout.onclick=()=>db.auth.signOut();
function shell(){nav.innerHTML=pages.map(([id,label])=>'<button data-p="'+id+'" class="'+(page===id?'active':'')+'">'+label+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.p;shell();render()})}
async function boot(){const {data}=await db.auth.getSession();session=data.session;toggle();db.auth.onAuthStateChange((_e,s)=>{session=s;toggle()})}
function toggle(){auth.classList.toggle('hidden',!!session);app.classList.toggle('hidden',!session);if(session){shell();render()}}
async function render(){if(!session)return;content.innerHTML='<div class="empty">در حال بارگذاری...</div>';if(page==='dashboard')return dashboard();if(page==='search')return searchPage();if(page==='chats')return chats();if(page==='import')return importPage()}
async function dashboard(){const [c,m,r]=await Promise.all([db.from('telegram_chats').select('*',{count:'exact',head:true}),db.from('telegram_messages').select('*',{count:'exact',head:true}),db.from('telegram_messages').select('id,sender_name,text,sent_at,telegram_chats(title)').order('sent_at',{ascending:false}).limit(8)]);const recent=r.data||[];content.innerHTML='<div class="head"><div><h2>داشبورد</h2><div class="muted">خلاصه حافظه تلگرام تو</div></div><span class="badge">'+esc(session.user.email)+'</span></div><div class="stats"><div class="stat glass"><span>💬</span><b>'+fa(m.count)+'</b><small>پیام</small></div><div class="stat glass"><span>👥</span><b>'+fa(c.count)+'</b><small>گفتگو</small></div><div class="stat glass"><span>🔒</span><b>RLS</b><small>داده خصوصی</small></div></div><div class="panel glass"><h3>آخرین پیام‌ها</h3>'+(recent.length?recent.map(x=>'<div class="row"><div class="meta"><b>'+esc(x.sender_name||'نامشخص')+'</b><span>'+esc(x.telegram_chats?.title||'')+'</span></div><p>'+esc(x.text||'[بدون متن]')+'</p><time>'+new Date(x.sent_at).toLocaleString('fa-IR')+'</time></div>').join(''):'<div class="empty">هنوز پیامی وارد نشده.</div>')+'</div>'}
function searchPage(){content.innerHTML='<div class="head"><div><h2>جست‌وجو</h2><div class="muted">بین پیام‌های تلگرام بگرد</div></div></div><form id="searchForm" class="search panel glass"><input id="q" class="input" placeholder="مثلاً: صحبت حسینی درباره دفتر"><button class="primary">جست‌وجو</button></form><div id="results" class="cards"></div>';searchForm.onsubmit=async e=>{e.preventDefault();if(!q.value.trim())return;results.innerHTML='<div class="empty">در حال جست‌وجو...</div>';const {data,error}=await db.rpc('keyword_message_search',{query_text:q.value.trim(),match_count:50});if(error){results.innerHTML='<div class="notice">'+esc(error.message)+'</div>';return}const rows=data||[];results.innerHTML=rows.length?rows.map(x=>'<div class="panel glass row"><div class="meta"><b>'+esc(x.sender_name||'نامشخص')+'</b><span>'+esc(x.chat_title||'')+'</span></div><p>'+esc(x.content||x.text||'')+'</p><time>'+new Date(x.sent_at).toLocaleString('fa-IR')+'</time></div>').join(''):'<div class="empty">چیزی پیدا نشد.</div>'}}
async function chats(){const {data}=await db.from('telegram_chats').select('*').order('last_message_at',{ascending:false,nullsFirst:false});const rows=data||[];content.innerHTML='<div class="head"><div><h2>گفتگوها</h2><div class="muted">چت‌های واردشده</div></div></div><div class="table panel glass">'+(rows.length?rows.map(r=>'<div class="item"><div><b>'+esc(r.title)+'</b><div class="type">'+esc(r.chat_type)+'</div></div><span>'+fa(r.message_count)+' پیام</span><time>'+(r.last_message_at?new Date(r.last_message_at).toLocaleDateString('fa-IR'):'—')+'</time></div>').join(''):'<div class="empty">هنوز گفتگویی وارد نشده.</div>')+'</div>'}
function msgText(v){if(typeof v==='string')return v;if(!Array.isArray(v))return'';return v.map(p=>typeof p==='string'?p:(p&&typeof p.text==='string'?p.text:'')).join('')}
function numericId(v){if(typeof v==='number')return String(v);const m=String(v??'').match(/-?\d+/);return m?m[0]:null}
function chatType(t){const s=String(t||'').toLowerCase();if(s.includes('saved'))return'saved_messages';if(s.includes('private')||s.includes('personal'))return'private';if(s.includes('supergroup'))return'supergroup';if(s.includes('group'))return'group';if(s.includes('channel'))return'channel';return'unknown'}
function parseExport(j,privateOnly){const raw=j?.chats?.list||j?.chats||[];const out=[];for(const c of raw){const cid=numericId(c.id);if(!cid)continue;const ct=chatType(c.type);if(privateOnly&&!['private','saved_messages'].includes(ct))continue;const messages=(c.messages||[]).map(m=>({telegram_message_id:Number(m.id),sender_name:m.from||m.actor||null,sent_at:m.date?new Date(m.date).toISOString():(m.date_unixtime?new Date(Number(m.date_unixtime)*1000).toISOString():new Date().toISOString()),text:msgText(m.text),reply_to_message_id:m.reply_to_message_id?Number(m.reply_to_message_id):null,is_service:m.type==='service',has_media:Boolean(m.file||m.photo||m.media_type),media_type:m.media_type||(m.photo?'photo':m.file?'file':null),raw:m})).filter(m=>Number.isFinite(m.telegram_message_id));const copy={...c};delete copy.messages;out.push({telegram_chat_id:cid,title:c.name||c.title||'بدون نام',username:c.username||null,chat_type:ct,raw:copy,messages})}return out}
const chunk=(a,n)=>Array.from({length:Math.ceil(a.length/n)},(_,i)=>a.slice(i*n,i*n+n));
function importPage(){content.innerHTML='<div class="head"><div><h2>ورود اطلاعات تلگرام</h2><div class="muted">فایل result.json خروجی Telegram Desktop</div></div></div><div class="upload panel glass"><div class="big">⬆️</div><h3>result.json</h3><p class="muted">Telegram Desktop → Settings → Advanced → Export Telegram Data → JSON</p><label class="check"><input id="privateOnly" type="checkbox" checked> فقط چت خصوصی و Saved Messages</label><label class="file primary">انتخاب فایل<input id="file" type="file" accept="application/json,.json"></label><div id="progress" class="progress"></div></div>';file.onchange=async()=>{const f=file.files?.[0];if(!f)return;file.disabled=true;progress.textContent='در حال خواندن فایل...';try{const j=JSON.parse(await f.text());const cs=parseExport(j,privateOnly.checked);const total=cs.reduce((a,c)=>a+c.messages.length,0);let count=0;for(let ci=0;ci<cs.length;ci++){const c=cs[ci];progress.textContent='گفتگو '+fa(ci+1)+' از '+fa(cs.length)+' — '+fa(count)+' از '+fa(total)+' پیام';const cr=await db.from('telegram_chats').upsert({owner_id:session.user.id,telegram_chat_id:c.telegram_chat_id,title:c.title,username:c.username,chat_type:c.chat_type,raw:c.raw,message_count:c.messages.length,last_message_at:c.messages.at(-1)?.sent_at||null},{onConflict:'owner_id,telegram_chat_id'}).select('id').single();if(cr.error)throw cr.error;for(const batch of chunk(c.messages,150)){const payload=batch.map(m=>({owner_id:session.user.id,chat_id:cr.data.id,telegram_message_id:m.telegram_message_id,sender_name:m.sender_name,sent_at:m.sent_at,text:m.text,normalized_text:m.text,reply_to_message_id:m.reply_to_message_id,is_service:m.is_service,has_media:m.has_media,media_type:m.media_type,raw:m.raw}));const mr=await db.from('telegram_messages').upsert(payload,{onConflict:'owner_id,chat_id,telegram_message_id'}).select('id,text');if(mr.error)throw mr.error;const xs=(mr.data||[]).filter(x=>x.text?.trim()).map(x=>({owner_id:session.user.id,message_id:x.id,chunk_index:0,content:x.text}));if(xs.length){const xr=await db.from('message_chunks').upsert(xs,{onConflict:'message_id,chunk_index'});if(xr.error)throw xr.error}count+=batch.length}}progress.textContent='✅ '+fa(cs.length)+' گفتگو و '+fa(count)+' پیام وارد شد.'}catch(e){progress.textContent='خطا: '+e.message}finally{file.disabled=false}}}
boot();
</script>
</body>
</html>
