/* NEXMAD / Refined Glass DNA — maintain the original dark, red/maroon brand. */
:root {
 --bg:#080912;
 --glass:rgba(21,24,40,.48);
 --line:rgba(235,226,255,.16);
 --line2:rgba(235,226,255,.075);
 --shadow:0 19px 52px rgba(0,0,0,.37),0 0 27px rgba(103,58,160,.065);
 --blur:32px;
}
body {
 background:
  radial-gradient(ellipse 48% 42% at 83% 7%,rgba(105,40,100,.24),transparent 88%),
  radial-gradient(ellipse 52% 65% at 8% 53%,rgba(28,76,143,.19),transparent 89%),
  radial-gradient(ellipse 32% 38% at 65% 100%,rgba(144,32,70,.13),transparent 80%),
  linear-gradient(145deg,#080912,#0c0e1d 45%,#080912);
}
body:before {content:"";pointer-events:none;position:fixed;inset:0;
 background:linear-gradient(135deg,rgba(255,255,255,.012),transparent 38%,rgba(255,255,255,.008) 80%);z-index:0}
.ambient {z-index:0;opacity:.55;filter:blur(125px);animation:ambient-drift 18s ease-in-out infinite alternate}
.ambient.two{animation-delay:-7s}.ambient.three{animation-delay:-12s}
.shell {position:relative;z-index:1;isolation:isolate}
.sidebar {
 background:linear-gradient(165deg,rgba(21,21,40,.8),rgba(11,12,25,.88));
 -webkit-backdrop-filter:blur(48px) saturate(155%);
 backdrop-filter:blur(48px) saturate(155%);
 border-left-color:rgba(255,255,255,.12);
 box-shadow:-8px 0 46px rgba(0,0,0,.13),inset 1px 0 rgba(255,255,255,.045)
}
.workspace{position:relative}
.glass {
 background:linear-gradient(140deg,rgba(53,51,82,.45),rgba(23,27,49,.55) 37%,rgba(12,14,28,.68));
 border-color:rgba(229,218,255,.16);
 box-shadow:0 19px 51px rgba(0,0,0,.33),inset 0 1px rgba(255,255,255,.12),inset 0 0 27px rgba(255,255,255,.014);
 -webkit-backdrop-filter:blur(34px) saturate(155%);
 backdrop-filter:blur(34px) saturate(155%);
 transition:transform .32s cubic-bezier(.2,.7,.2,1),border-color .25s,box-shadow .3s;
}
.glass:before {height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),rgba(234,171,229,.1),transparent)}
.glass:hover {border-color:rgba(237,221,255,.245);box-shadow:0 26px 64px rgba(0,0,0,.38),0 0 34px rgba(112,63,159,.075),inset 0 1px rgba(255,255,255,.16)}
.profile-hero {
 background:
  radial-gradient(ellipse 45% 150% at 100% 12%,rgba(252,59,111,.23),transparent 76%),
  radial-gradient(ellipse 55% 160% at 0% 80%,rgba(96,51,181,.20),transparent 72%),
  linear-gradient(140deg,rgba(61,31,66,.57),rgba(21,21,38,.68) 62%,rgba(16,19,35,.71));
 border-color:rgba(242,168,218,.22)
}
.profile-img {box-shadow:0 16px 46px rgba(229,46,91,.32),0 0 0 5px rgba(255,255,255,.027);border:1px solid rgba(255,255,255,.29)}
.side-account {background:linear-gradient(110deg,rgba(244,68,118,.14),rgba(115,86,225,.06),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.15);box-shadow:inset 0 1px rgba(255,255,255,.13)}
.nav-link.active {background:linear-gradient(110deg,rgba(234,50,91,.28),rgba(151,63,171,.12));border-color:rgba(252,120,165,.24);box-shadow:inset 0 1px rgba(255,255,255,.055),0 5px 19px rgba(202,32,88,.07)}
.selector-wrap,.icon-button,.pill-group,.button:not(.button-primary) {background:rgba(45,48,73,.29);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border-color:rgba(255,255,255,.15)}
.button-primary {background:linear-gradient(115deg,#ff5477,#d91d52 51%,#af1f5e);box-shadow:0 11px 27px rgba(251,51,110,.18),inset 0 1px rgba(255,255,255,.19);border-color:rgba(255,176,197,.24)}
.metric {background:linear-gradient(155deg,rgba(48,45,73,.62),rgba(16,20,39,.59));overflow:hidden;isolation:isolate}
.metric:before {content:"";position:absolute;inset:-45% -18% 30% 30%;height:auto;background:radial-gradient(ellipse,rgba(246,85,137,.18),transparent 69%);pointer-events:none}
.metric:nth-child(2):before {background:radial-gradient(ellipse,rgba(101,152,255,.23),transparent 71%)}
.metric:nth-child(3):before {background:radial-gradient(ellipse,rgba(52,214,172,.16),transparent 71%)}
.metric:nth-child(4):before {background:radial-gradient(ellipse,rgba(166,111,249,.25),transparent 71%)}
.metric:after {height:2px;opacity:.55}
.metric .metric-icon {background:rgba(255,67,113,.12);border:1px solid rgba(255,255,255,.085);box-shadow:0 0 23px rgba(255,58,118,.085)}
.metric .number {text-shadow:0 2px 28px rgba(255,255,255,.065)}
.chart-card {background:linear-gradient(155deg,rgba(52,43,76,.48),rgba(15,20,38,.68) 55%,rgba(15,17,35,.75))}
.chart-svg .plot-line{filter:drop-shadow(0 0 10px rgba(255,70,128,.54))}
.chart-svg .plot-area {opacity:.82}
.top-reel {background:radial-gradient(ellipse 95% 80% at 17% 0%,rgba(255,80,134,.21),transparent 70%),linear-gradient(145deg,rgba(61,33,66,.58),rgba(17,17,35,.8))}
.mini-ai,.ai-hero,.report-hero {background:radial-gradient(ellipse at 94% 0%,rgba(141,88,245,.15),transparent 60%),linear-gradient(145deg,rgba(50,42,83,.55),rgba(18,19,38,.74))}
.account-tile,.reel-entry,.report-kpi,.insight-item,.action-item {backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.account-tile:hover,.add-tile:hover {transform:translateY(-4px)}
.add-tile {border-color:rgba(184,153,253,.26);background:linear-gradient(135deg,rgba(121,73,162,.095),rgba(255,255,255,.02))}
.modal{background:linear-gradient(145deg,rgba(38,30,61,.95),rgba(17,18,36,.97));-webkit-backdrop-filter:blur(60px);backdrop-filter:blur(60px);border-color:rgba(242,224,255,.19);box-shadow:0 38px 110px rgba(0,0,0,.68),inset 0 1px rgba(255,255,255,.09)}
.status-chip.live {background:rgba(30,164,117,.12)}
.page .glass {animation:glass-rise .55s cubic-bezier(.17,.74,.24,1) both}

 const xy=points.map((p,i)=>[padX+(points.length===1?W/2:i/(points.length-1)*W),padY+H-(num(p[metric])/vMax)*H]);
 const line=xy.map(([x,y],i)=>`${i?'L':'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');const area=line+` L${xy[xy.length-1][0]} ${padY+H} L${xy[0][0]} ${padY+H} Z`;
 const axis=[0,.33,.67,1].map(v=>`<g><path class="gridline" d="M${padX} ${padY+H-H*v}H${padX+W}"/><text x="4" y="${padY+H-H*v+4}">${v===0?'0':vMax>=1000?(v*vMax/1000).toFixed(vMax>=10000?0:1)+'k':Math.round(v*vMax)}</text></g>`).join('');
 const labels=[0,Math.round((points.length-1)/2),points.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${xy[i][0]}" y="${height-4}" text-anchor="middle">${esc(points[i][dateProp].slice(5))}</text>`).join('');
 return `<svg role="img" aria-label="نمودار ${metric}" class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"><defs><linearGradient id="areaRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff3555" stop-opacity=".23"/><stop offset="1" stop-color="#ff3555" stop-opacity="0"/></linearGradient></defs>${axis}<path class="plot-area" d="${area}"/><path class="plot-line" d="${line}"/>${xy.map(([x,y],i)=>`<circle class="point" cx="${x}" cy="${y}" r="4"><title>${points[i][dateProp]}: ${num(points[i][metric]).toLocaleString('en-US')}</title></circle>`).join('')}${labels}</svg>`
}

function exportCsv(){const cols=['Date','Media ID','Media product type','Media permalink','Media caption','Views','Comments count','Media reach','Shares','Like count','Reels average minutes watched','Reels skip rate','Reels minutes viewed','Unique saves'];let rows=[cols,...selectItems().map(x=>[x.date,x.id,x.type,x.url,x.caption,x.views,x.comments,x.reach,x.shares,x.likes,x.watchSec,x.skipRate,x.watchMinutes,x.saves])];blobDownload(`nexmad_${activeAccount().username||'account'}_${getDates().to}.csv`,'text/csv;charset=utf-8','\ufeff'+rows.map(csvLine).join('\r\n'));toast('گزارش CSV آماده شد')}
function exportJson(){let x={account:{name:activeAccount().name,username:activeAccount().username},period:getDates(),generatedAt:new Date().toISOString(),provenance:getData().meta,summary:makeMetrics(selectItems()),followerGrowth:growth(getDates().from,getDates().to),items:selectItems()};blobDownload(`nexmad_report_${getDates().to}.json`,'application/json;charset=utf-8',JSON.stringify(x,null,2));toast('فایل JSON آماده شد')}
function csvParse(text){let rows=[],row=[],field='',quote=false;for(let i=0;i<text.length;i++){let c=text[i],next=text[i+1];if(c==='"'&&quote&&next==='"'){field+='"';i++}else if(c==='"')quote=!quote;else if(c===','&&!quote){row.push(field);field=''}else if((c==='\r'||c==='\n')&&!quote){if(c==='\r'&&next==='\n')i++;row.push(field);field='';if(row.some(v=>v!==''))rows.push(row);row=[]}else field+=c}if(field||row.length){row.push(field);rows.push(row)}return rows}
function importedRows(rows){if(!rows?.length)throw Error('CSV خالی است');const header=rows[0].map(x=>x.trim());let pos=Object.fromEntries(header.map((k,i)=>[k,i]));if(pos['Media ID']===undefined||pos['Views']===undefined)throw Error('فایل CSV باید ستون‌های Media ID و Views داشته باشد');let map=new Map();for(const r of rows.slice(1)){let id=r[pos['Media ID']];if(!id)continue;let x={id,date:r[pos['Date']]||'',type:r[pos['Media product type']]||'REELS',url:r[pos['Media permalink']]||'',caption:r[pos['Media caption']]||'',views:num((r[pos['Views']]||'').replaceAll(',','')),comments:num(r[pos['Comments count']]),reach:num(r[pos['Media reach']]),shares:num(r[pos['Shares']]),likes:num(r[pos['Like count']]),watchSec:parseWatch(r[pos['Reels average minutes watched']]),skipRate:num(r[pos['Reels skip rate']]),watchMinutes:num(r[pos['Reels minutes viewed']]),saves:num(r[pos['Unique saves']])};if(x.type!=='REELS')continue;if(!map.has(id)||map.get(id).views<x.views)map.set(id,x)}return [...map.values()].sort((a,b)=>b.date.localeCompare(a.date))}
function parseWatch(v){if(!v)return 0;let p=String(v).split(':');if(p.length===2)return num(p[0])*60+num(p[1]);return num(v)}
function importCsv(){if(!state.offline){toast('داده‌های آنلاین از Instagram API می‌آیند؛ ورود CSV فقط برای پیش‌نمایش محلی مجاز است.',true);return}let el=document.createElement('input');el.type='file';el.accept='.csv,text/csv';el.onchange=async()=>{const f=el.files?.[0];if(!f)return;try{const rows=csvParse((await f.text()).replace(/^\ufeff/,''));const items=importedRows(rows);state.localData=state.localData||{};state.localData[state.currentId]={profile:{followers:0,following:0,mediaCount:items.length},followers:[],items,meta:{mode:'snapshot',source:'CSV واردشده در مرورگر',asOf:new Date().toISOString(),warning:'این داده‌ها فقط در همین مرورگر ذخیره شده‌اند؛ خودکار به‌روز نمی‌شوند.'}};saveLocal();toast(`${nf(items.length)} ریلز از CSV دریافت شد`);await loadCurrent()}catch(e){toast(e.message,true)}};el.click()}
async function avatarUpload(f){if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type)){toast('فقط PNG، JPEG یا WebP مجاز است',true);return}if(f.size>8*1024*1024){toast('حجم عکس بیش از 8 مگابایت است',true);return}try{const data=await new Promise((resolve,reject)=>{let img=new Image(),obj=URL.createObjectURL(f);img.onload=()=>{let sz=144,c=document.createElement('canvas');c.width=c.height=sz;let ctx=c.getContext('2d');let side=Math.min(img.width,img.height),sx=(img.width-side)/2,sy=(img.height-side)/2;ctx.drawImage(img,sx,sy,side,side,0,0,sz,sz);URL.revokeObjectURL(obj);let v=c.toDataURL('image/jpeg',.69);if(v.length>40000){let s=112;c.width=c.height=s;ctx.drawImage(img,sx,sy,side,side,0,0,s,s);v=c.toDataURL('image/jpeg',.58)}resolve(v)};img.onerror=reject;img.src=obj});
 if(data.length>40000)throw new Error('تصویر پس از فشرده‌سازی هنوز بزرگ است؛ تصویر کوچک‌تری انتخاب کن');const a=activeAccount(),updated={...a,avatar:data};if(state.offline){state.accounts=state.accounts.map(x=>x.id===a.id?updated:x);saveLocal()}else{let r=await api('saveAccount',{method:'POST',body:updated});state.accounts=state.accounts.map(x=>x.id===a.id?r.account:x)}render();toast('تصویر پروفایل تغییر کرد')}catch(e){toast('تغییر تصویر ناموفق بود: '+e.message,true)}}
function deleteAccount(id){const a=state.accounts.find(x=>x.id===id);if(!a)return;if(!confirm(`اتصال اکانت «${a.name}» از داشبورد قطع شود؟ دسترسی اپ به داده‌های این اکانت در سرور حذف می‌شود.`))return;
 const work=async()=>{if(state.offline){state.accounts=state.accounts.filter(x=>x.id!==id);delete state.localData?.[id];saveLocal()}else{await api('deleteAccount',{method:'POST',body:{id}});await hydrateAccounts()}if(state.currentId===id)state.currentId=state.accounts[0]?.id||'';toast('اکانت از داشبورد حذف شد');await loadCurrent()};work().catch(e=>toast(e.message,true))}
function ruleAnswer(){const ins=insightsFor(selectItems());const m=ins.m||makeMetrics([]);return `تحلیل مبتنی بر قواعد (بدون مدل AI)\n\n• در بازه انتخابی ${nf(m.count)} ریلز بررسی شدند. مجموع بازدید کنونی آن‌ها ${nf(m.views)} است.\n• نرخ ذخیره/بازدید ${pct(m.saveRate)} و نرخ اشتراک/بازدید ${pct(m.shareRate)} ثبت شده است.\n• میانگین ساده Skip Rate: ${pct(m.avgSkip)}.\n\nاقدام‌های پیشنهادی:\n${ins.actions.map((x,i)=>`${i+1}. ${x.title}: ${x.text}`).join('\n')}\n\nتوجه: مقادیر مربوط به ریلزهای منتشرشده در دوره‌اند، نه الزاماً بازدید کسب‌شده در طول دوره. برای پاسخ اختصاصی به سؤال، OPENAI_API_KEY را روی سرور فعال کن.`}
async function aiSubmit(question){const items=selectItems();if(!state.aiAvailable){state.aiAnswer=ruleAnswer();$('aiResponse').textContent=state.aiAnswer;toast('تحلیل قواعدی آماده شد');return}if(state.aiRunning)return;state.aiRunning=true;const btn=$('aiForm')?.querySelector('button[type=submit]');if(btn){btn.disabled=true;btn.textContent='در حال تحلیل...'}$('aiResponse').textContent='در حال تحلیل داده‌ها با مدل زبانی...';try{const stats={account:activeAccount().name,period:getDates(),summary:makeMetrics(items),topViews:[...items].sort((a,b)=>b.views-a.views).slice(0,6).map(x=>({date:x.date,caption:x.caption.slice(0,160),views:x.views,saves:x.saves,shares:x.shares,skipRate:x.skipRate})),topSaved:[...items].sort((a,b)=>b.saves-a.saves).slice(0,4).map(x=>({caption:x.caption.slice(0,100),views:x.views,saves:x.saves,shares:x.shares})),followerGrowth:growth(getDates().from,getDates().to),source:getData().meta?.mode};let r=await api('ai',{method:'POST',body:{question,stats}});state.aiAnswer=r.answer;$('aiResponse').textContent=r.answer}catch(e){state.aiAnswer='خطا در اتصال AI: '+e.message;$('aiResponse').textContent=state.aiAnswer;toast(e.message,true)}finally{state.aiRunning=false;if(btn){btn.disabled=false;btn.innerHTML=`${I('send')} تحلیل با AI`}}}
async function bootstrap(){const pref=loadJson(STORAGE,{});state.dark=pref.dark!==false;state.range=[7,30,90,0].includes(pref.range)?pref.range:90;hydrated();
 try{const r=await api('status');state.configured=r.configured;state.authenticated=r.authenticated;state.aiAvailable=r.aiAvailable;if(r.configured){if(!r.authenticated){state.accounts=[mockAccount()];state.currentId='nexmad-demo';state.data={items:[],followers:[],profile:{},meta:{mode:'empty'}};render();loginModal();return}await hydrateAccounts();await loadCurrent();return}}
 catch(e){/* File protocol or static preview: API absent; intentionally use labeled sample data. */}
 initDemo();state.currentId=state.accounts.some(a=>a.id===pref.currentId)?pref.currentId:state.accounts[0].id;await loadCurrent();toast('نسخه عمومی اجرا شد؛ آمار فعلی نمونه است. برای داده خودت اکانت بساز و CSV وارد کن.')}
// Event delegation
 document.addEventListener('click',async event=>{
  const el=event.target.closest('[data-action],[data-view],[data-range],[data-question]');
  if(!el){if(event.target.classList.contains('modal-backdrop'))closeModal();return}
  if(el.dataset.view){setView(el.dataset.view);return}
  if(el.dataset.range!==undefined){state.range=Number(el.dataset.range);state.customFrom='';state.customTo='';render();return}
  if(el.dataset.question){let inp=$('aiQuestion');if(inp){inp.value=el.dataset.question;inp.focus()}return}
  const act=el.dataset.action;
  if(act==='toggle-menu'){$('sidebar').classList.toggle('open');return}
  if(act==='refresh'){el.classList.add('refreshing');await loadCurrent({quiet:true});el.classList.remove('refreshing');return}
  if(act==='add-account')return accountModal();
  if(act==='connect-instagram'){if(state.offline){toast('اتصال مستقیم در GitHub Pages فعال نیست؛ برای آمار واقعی باید Meta OAuth و سرور خصوصی راه‌اندازی شود.',true);return}location.assign('/api/index?action=connectInstagram');return}
  if(act==='save-account'){const f=$('accountForm');if(f?.reportValidity())return saveAccountFromForm(f);return}
  if(act==='login'){const f=$('loginForm');if(!f?.reportValidity())return;try{await api('login',{method:'POST',body:{password:new FormData(f).get('password')}});state.authenticated=true;$('modalLayer').dataset.closable='yes';closeModal();await hydrateAccounts();await loadCurrent();toast('به داشبورد خوش آمدی')}catch(e){toast(e.message,true)}return}
  if(act==='edit-account')return accountModal(el.dataset.id||state.currentId);
  if(act==='delete-account')return deleteAccount(el.dataset.id);
  if(act==='close-modal')return closeModal();
  if(act==='switch-account'){state.currentId=el.dataset.id;state.aiAnswer='';setView('overview');await loadCurrent();return}
  if(act==='detail')return detailModal(el.dataset.id);
  if(act==='upload-avatar'){$('avatarPicker').value='';$('avatarPicker').click();return}
  if(act==='export-csv')return exportCsv();
  if(act==='export-json')return exportJson();
  if(act==='print'){window.print();return}
  if(act==='apply-dates'){let from=$('reportFrom')?.value,to=$('reportTo')?.value;if(!from||!to||from>to){toast('بازه تاریخ معتبر نیست',true);return}state.range='custom';state.customFrom=from;state.customTo=to;render();return}
  if(act==='toggle-theme'){state.dark=!state.dark;render();return}
  if(act==='import-csv')return importCsv();
  if(act==='logout'){await api('logout',{method:'POST',body:{}}).catch(()=>{});location.reload();return}
 });
 document.addEventListener('change',async event=>{
  if(event.target.id==='accountSelect'){state.currentId=event.target.value;state.aiAnswer='';await loadCurrent();return}
  if(event.target.id==='contentSort'){state.sort=event.target.value;render();return}
  if(event.target.id==='avatarPicker')return avatarUpload(event.target.files?.[0]);
 });
 document.addEventListener('input',event=>{if(event.target.id==='contentSearch'){state.search=event.target.value;let pos=event.target.selectionStart;render();let input=$('contentSearch');if(input){input.focus();input.setSelectionRange(pos,pos)}}});
 document.addEventListener('submit',async event=>{
  if(event.target.id==='accountForm'){event.preventDefault();await saveAccountFromForm(event.target);return}
  if(event.target.id==='loginForm'){event.preventDefault();let f=new FormData(event.target);try{await api('login',{method:'POST',body:{password:f.get('password')}});state.authenticated=true;$('modalLayer').dataset.closable='yes';closeModal();await hydrateAccounts();await loadCurrent();toast('به داشبورد خوش آمدی')}catch(e){toast(e.message,true)}return}
  if(event.target.id==='aiForm'){event.preventDefault();await aiSubmit(new FormData(event.target).get('question'));return}
 });
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.closest('#accountForm')){e.preventDefault();const f=$('accountForm');if(f?.reportValidity())saveAccountFromForm(f)}if(e.key==='Enter'&&e.target.closest('#loginForm')){e.preventDefault();$('loginForm')?.querySelector('[data-action=login]')?.click()}});
 setInterval(()=>{if(document.visibilityState==='visible'&&!state.offline&&state.authenticated)loadCurrent({quiet:false})},15*60*1000);
 bootstrap();

</script>
