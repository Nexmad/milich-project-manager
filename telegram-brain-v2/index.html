<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#08111d" />
<title>Telegram Brain</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{font-family:Tahoma,Arial,sans-serif;background:#07111f;color:#eef6ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#173b68 0,transparent 28%),radial-gradient(circle at 80% 80%,#0b6c8050 0,transparent 30%),#07111f;color:#eef6ff}.hidden{display:none!important}.glass{background:linear-gradient(135deg,#ffffff13,#ffffff07);border:1px solid #ffffff18;box-shadow:0 24px 60px #0008;backdrop-filter:blur(18px)}button,input{font:inherit}.auth{min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(460px,100%);padding:34px;border-radius:30px;text-align:center}.logo{font-size:58px}.muted{color:#93a6bf}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:26px 0 14px;background:#0004;padding:5px;border-radius:14px}.tabs button{border:0;border-radius:11px;padding:12px;background:transparent;color:#9aabc1;cursor:pointer}.tabs button.active{background:#ffffff12;color:#fff}.form{display:grid;gap:12px}.input{width:100%;padding:14px 15px;border-radius:14px;border:1px solid #ffffff18;background:#06101a;color:#fff;outline:none}.primary{border:0;border-radius:14px;padding:13px 18px;background:linear-gradient(135deg,#2098ff,#5756ff);color:#fff;cursor:pointer;font-weight:700}.primary:disabled{opacity:.6;cursor:wait}.notice{margin-top:13px;padding:12px;border-radius:12px;background:#ffffff0d;color:#dce7f5;font-size:13px;line-height:1.8}.error{background:#7d1d2b55;color:#ffd8dd}.ok{background:#0d6c4d55;color:#bff6df}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{margin:16px;padding:18px;border-radius:24px;height:calc(100vh - 32px);position:sticky;top:16px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:8px 6px 24px}.brand .emoji{font-size:31px}.brand small{display:block;color:#8195af}.nav{display:grid;gap:7px}.nav button,.logout{border:0;background:transparent;color:#a3b3c9;text-align:right;padding:12px;border-radius:12px;cursor:pointer}.nav button.active,.nav button:hover{background:#1f96ff22;color:#fff}.logout{margin-top:auto;color:#ffb1ba}.main{padding:28px 32px 100px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}.head h2{margin:0 0 8px;font-size:28px}.badge{padding:8px 12px;border:1px solid #ffffff18;background:#ffffff0b;border-radius:999px;color:#becbdb}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}.stat,.panel{border-radius:20px;padding:19px}.stat{display:grid;gap:8px}.stat b{font-size:30px}.stat small{color:#91a1b7}.panel{margin-bottom:14px}.row{padding:13px 0;border-bottom:1px solid #ffffff0d}.row:last-child{border-bottom:0}.meta{display:flex;gap:10px;flex-wrap:wrap}.meta span{color:#69aff9;font-size:12px}.row p{line-height:1.9;color:#d8e3f0}.row time{color:#7488a3;font-size:11px}.search{display:grid;grid-template-columns:1fr auto;gap:10px}.empty{text-align:center;padding:32px;color:#8196b1}.upload{text-align:center;padding:38px}.upload .big{font-size:48px}.check{display:flex;justify-content:center;align-items:center;gap:8px;margin:15px 0;color:#c0cedd}.file{display:inline-block;margin-top:8px}.file input{display:none}.progress{margin-top:15px;color:#c8d6e5;line-height:1.9;white-space:pre-line}.chatItem{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #ffffff0d}.chatItem:last-child{border:0}.hint{margin-top:12px;font-size:12px;color:#8fa4bd;line-height:1.9}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:10;left:10px;right:10px;bottom:10px;top:auto;height:auto;margin:0;padding:8px}.brand,.logout{display:none}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.main{padding:22px 14px 95px}.stats{grid-template-columns:1fr 1fr}.head{display:block}.badge{display:inline-block;margin-top:10px}}@media(max-width:520px){.stats{grid-template-columns:1fr}.upload{padding:24px 12px}}
</style>
</head>
<body>
<div id="authView" class="auth">
  <div class="card glass">
    <div class="logo">🧠</div><h1>Telegram Brain</h1><div class="muted">حافظه هوشمند گفتگوهای تلگرام</div>
    <div class="tabs"><button id="signinTab" class="active" type="button">ورود</button><button id="signupTab" type="button">ساخت حساب</button></div>
    <form id="authForm" class="form"><input id="emailInput" class="input" type="email" autocomplete="email" placeholder="ایمیل" required><input id="passwordInput" class="input" type="password" autocomplete="current-password" minlength="6" placeholder="رمز عبور (حداقل ۶ کاراکتر)" required><button id="authButton" class="primary" type="submit">ورود</button></form>
    <div id="authMessage" class="notice hidden"></div>
  </div>
</div>
<div id="appView" class="app hidden">
  <aside class="side glass"><div class="brand"><div class="emoji">🧠</div><div><b>Telegram Brain</b><small>Second Brain</small></div></div><div id="nav" class="nav"></div><button id="logoutButton" class="logout">خروج</button></aside>
  <main class="main"><div id="content"></div></main>
</div>
<script>
(function(){
const SB_URL='https://cohandrixpdthmpbxnsc.supabase.co';
const SB_KEY='sb_publishable_hPH1KRp-KM_RDY0pMwzT2w_SbF-jHjB';
if(!window.supabase){document.body.innerHTML='<div class="auth"><div class="card glass"><h2>خطا در بارگذاری Supabase</h2><p>صفحه را Refresh کن.</p></div></div>';return;}
const supa=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const el={authView:document.getElementById('authView'),appView:document.getElementById('appView'),signinTab:document.getElementById('signinTab'),signupTab:document.getElementById('signupTab'),authForm:document.getElementById('authForm'),email:document.getElementById('emailInput'),password:document.getElementById('passwordInput'),authButton:document.getElementById('authButton'),authMessage:document.getElementById('authMessage'),nav:document.getElementById('nav'),logout:document.getElementById('logoutButton'),content:document.getElementById('content')};
let mode='signin',session=null,page='dashboard';
const pages=[['dashboard','داشبورد'],['search','جست‌وجو'],['chats','گفتگوها'],['import','ورود اطلاعات']];
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const fa=n=>Number(n||0).toLocaleString('fa-IR');
const setMsg=(text,type='')=>{el.authMessage.textContent=text;el.authMessage.className='notice '+(type||'');};
const clearMsg=()=>{el.authMessage.className='notice hidden';el.authMessage.textContent='';};
function setMode(next){mode=next;el.signinTab.classList.toggle('active',mode==='signin');el.signupTab.classList.toggle('active',mode==='signup');el.authButton.textContent=mode==='signin'?'ورود':'ساخت حساب';el.password.setAttribute('autocomplete',mode==='signin'?'current-password':'new-password');clearMsg();}
el.signinTab.onclick=()=>setMode('signin');el.signupTab.onclick=()=>setMode('signup');
el.authForm.onsubmit=async e=>{e.preventDefault();clearMsg();const email=el.email.value.trim(),password=el.password.value;if(!email||password.length<6){setMsg('ایمیل معتبر و رمز حداقل ۶ کاراکتری وارد کن.','error');return;}el.authButton.disabled=true;try{const r=mode==='signup'?await supa.auth.signUp({email,password}):await supa.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(mode==='signup')setMsg(r.data.session?'حساب ساخته شد و وارد شدی ✅':'حساب ساخته شد. ایمیل تأیید را بررسی کن.','ok');}catch(err){setMsg('خطا: '+(err?.message||String(err)),'error');}finally{el.authButton.disabled=false;el.authButton.textContent=mode==='signin'?'ورود':'ساخت حساب';}};
el.logout.onclick=()=>supa.auth.signOut();
function buildNav(){el.nav.innerHTML=pages.map(([id,label])=>`<button data-page="${id}" class="${page===id?'active':''}">${label}</button>`).join('');el.nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;buildNav();render();});}
function toggle(){const logged=!!session;el.authView.classList.toggle('hidden',logged);el.appView.classList.toggle('hidden',!logged);if(logged){buildNav();render();}}
async function boot(){const {data}=await supa.auth.getSession();session=data?.session||null;toggle();supa.auth.onAuthStateChange((_e,s)=>{session=s;toggle();});}
async function render(){if(!session)return;el.content.innerHTML='<div class="empty">در حال بارگذاری...</div>';if(page==='dashboard')return dashboard();if(page==='search')return searchPage();if(page==='chats')return chatsPage();if(page==='import')return importPage();}
async function dashboard(){const [c,m,r]=await Promise.all([supa.from('telegram_chats').select('*',{count:'exact',head:true}),supa.from('telegram_messages').select('*',{count:'exact',head:true}),supa.from('telegram_messages').select('id,sender_name,text,sent_at,telegram_chats(title)').order('sent_at',{ascending:false}).limit(8)]);const recent=r.data||[];el.content.innerHTML=`<div class="head"><div><h2>داشبورد</h2><div class="muted">خلاصه حافظه تلگرام تو</div></div><span class="badge">${esc(session.user.email)}</span></div><div class="stats"><div class="stat glass"><span>💬</span><b>${fa(m.count)}</b><small>پیام</small></div><div class="stat glass"><span>👥</span><b>${fa(c.count)}</b><small>گفتگو</small></div><div class="stat glass"><span>🔒</span><b>RLS</b><small>داده خصوصی</small></div></div><div class="panel glass"><h3>آخرین پیام‌ها</h3>${recent.length?recent.map(x=>`<div class="row"><div class="meta"><b>${esc(x.sender_name||'نامشخص')}</b><span>${esc(x.telegram_chats?.title||'')}</span></div><p>${esc(x.text||'[بدون متن]')}</p><time>${x.sent_at?new Date(x.sent_at).toLocaleString('fa-IR'):'—'}</time></div>`).join(''):'<div class="empty">هنوز پیامی وارد نشده.</div>'}</div>`;}
function searchPage(){el.content.innerHTML=`<div class="head"><div><h2>جست‌وجو</h2><div class="muted">بین پیام‌های تلگرام بگرد</div></div></div><form id="searchForm" class="search panel glass"><input id="q" class="input" placeholder="مثلاً: صحبت حسینی درباره دفتر"><button class="primary">جست‌وجو</button></form><div id="results"></div>`;const form=document.getElementById('searchForm'),q=document.getElementById('q'),results=document.getElementById('results');form.onsubmit=async e=>{e.preventDefault();const term=q.value.trim();if(!term)return;results.innerHTML='<div class="empty">در حال جست‌وجو...</div>';const {data,error}=await supa.rpc('keyword_message_search',{query_text:term,match_count:50});if(error){results.innerHTML=`<div class="notice error">${esc(error.message)}</div>`;return;}const rows=data||[];results.innerHTML=rows.length?rows.map(x=>`<div class="panel glass row"><div class="meta"><b>${esc(x.sender_name||'نامشخص')}</b><span>${esc(x.chat_title||'')}</span></div><p>${esc(x.content||x.text||'')}</p><time>${x.sent_at?new Date(x.sent_at).toLocaleString('fa-IR'):'—'}</time></div>`).join(''):'<div class="empty">چیزی پیدا نشد.</div>';};}
async function chatsPage(){const {data,error}=await supa.from('telegram_chats').select('*').order('last_message_at',{ascending:false,nullsFirst:false});if(error){el.content.innerHTML=`<div class="notice error">${esc(error.message)}</div>`;return;}const rows=data||[];el.content.innerHTML=`<div class="head"><div><h2>گفتگوها</h2><div class="muted">چت‌های واردشده</div></div></div><div class="panel glass">${rows.length?rows.map(r=>`<div class="chatItem"><div><b>${esc(r.title)}</b><div class="muted">${esc(r.chat_type)}</div></div><span>${fa(r.message_count)} پیام</span></div>`).join(''):'<div class="empty">هنوز گفتگویی وارد نشده.</div>'}</div>`;}
function msgText(v){if(typeof v==='string')return v;if(!Array.isArray(v))return'';return v.map(p=>typeof p==='string'?p:(p&&typeof p.text==='string'?p.text:'')).join('');}
function numericId(v){if(typeof v==='number')return String(v);const m=String(v??'').match(/-?\d+/);return m?m[0]:null;}
function chatType(t){const s=String(t||'').toLowerCase();if(s.includes('saved'))return'saved_messages';if(s.includes('private')||s.includes('personal'))return'private';if(s.includes('supergroup'))return'supergroup';if(s.includes('group'))return'group';if(s.includes('channel'))return'channel';return'unknown';}
function parseExport(j,privateOnly){const raw=j?.chats?.list||j?.chats||[];const out=[];for(const c of raw){const cid=numericId(c.id);if(!cid)continue;const ct=chatType(c.type);if(privateOnly&&!['private','saved_messages'].includes(ct))continue;const messages=(c.messages||[]).map(m=>({telegram_message_id:Number(m.id),sender_name:m.from||m.actor||null,sent_at:m.date?new Date(m.date).toISOString():(m.date_unixtime?new Date(Number(m.date_unixtime)*1000).toISOString():new Date().toISOString()),text:msgText(m.text),reply_to_message_id:m.reply_to_message_id?Number(m.reply_to_message_id):null,is_service:m.type==='service',has_media:Boolean(m.file||m.photo||m.media_type),media_type:m.media_type||(m.photo?'photo':m.file?'file':null)})).filter(m=>Number.isFinite(m.telegram_message_id));const copy={...c};delete copy.messages;out.push({telegram_chat_id:cid,title:c.name||c.title||'بدون نام',username:c.username||null,chat_type:ct,raw:copy,messages});}return out;}
const chunk=(a,n)=>Array.from({length:Math.ceil(a.length/n)},(_,i)=>a.slice(i*n,i*n+n));
function repairInvalidJsonEscapes(text){let inString=false,last=0,repairs=0;const parts=[];const valid=new Set(['"','\\','/','b','f','n','r','t','u']);for(let i=0;i<text.length;i++){const ch=text[i];if(!inString){if(ch==='"')inString=true;continue;}if(ch==='"'){inString=false;continue;}if(ch==='\\'){const next=text[i+1];if(valid.has(next)){i++;continue;}parts.push(text.slice(last,i),'\\\\');last=i+1;repairs++;continue;}const code=ch.charCodeAt(0);if(code<32){parts.push(text.slice(last,i),JSON.stringify(ch).slice(1,-1));last=i+1;repairs++;}}
if(!repairs)return {text,repairs:0};parts.push(text.slice(last));return {text:parts.join(''),repairs};}
function parseTelegramJson(text,progress){try{return JSON.parse(text);}catch(first){const msg=String(first?.message||first);if(!/escaped character|control character|JSON/i.test(msg))throw first;progress.textContent='⚠️ فایل JSON یک ایراد ساختاری دارد. در حال تعمیر خودکار escapeهای خراب...';const fixed=repairInvalidJsonEscapes(text);if(!fixed.repairs)throw first;progress.textContent=`🔧 ${fa(fixed.repairs)} مورد خراب پیدا و اصلاح شد. در حال خواندن دوباره فایل...`;return JSON.parse(fixed.text);}}
function formatMB(bytes){return (bytes/1024/1024).toLocaleString('fa-IR',{maximumFractionDigits:1})+' MB';}
function importPage(){el.content.innerHTML=`<div class="head"><div><h2>ورود اطلاعات تلگرام</h2><div class="muted">فایل result.json خروجی Telegram Desktop</div></div></div><div class="upload panel glass"><div class="big">⬆️</div><h3>result.json</h3><p class="muted">Telegram Desktop → Settings → Advanced → Export Telegram Data → JSON</p><label class="check"><input id="privateOnly" type="checkbox" checked> فقط چت خصوصی و Saved Messages</label><label class="file primary">انتخاب فایل<input id="fileInput" type="file" accept="application/json,.json"></label><div id="progress" class="progress"></div><div class="hint">نسخه جدید، خطاهای Bad escaped character را قبل از Import به‌صورت خودکار تعمیر می‌کند.</div></div>`;const file=document.getElementById('fileInput'),privateOnly=document.getElementById('privateOnly'),progress=document.getElementById('progress');file.onchange=async()=>{const f=file.files?.[0];if(!f)return;file.disabled=true;progress.textContent=`فایل: ${formatMB(f.size)}\nدر حال خواندن...`;try{await new Promise(r=>setTimeout(r,50));let text=await f.text();progress.textContent=`فایل ${formatMB(f.size)} خوانده شد. در حال بررسی JSON...`;await new Promise(r=>setTimeout(r,50));const json=parseTelegramJson(text,progress);text=null;const chats=parseExport(json,privateOnly.checked);const total=chats.reduce((s,c)=>s+c.messages.length,0);let imported=0;progress.textContent=`✅ JSON سالم شد. ${fa(chats.length)} گفتگو و ${fa(total)} پیام پیدا شد.\nشروع Import...`;for(let i=0;i<chats.length;i++){const c=chats[i];progress.textContent=`گفتگو ${fa(i+1)} از ${fa(chats.length)} — ${fa(imported)} از ${fa(total)} پیام`;const cr=await supa.from('telegram_chats').upsert({owner_id:session.user.id,telegram_chat_id:c.telegram_chat_id,title:c.title,username:c.username,chat_type:c.chat_type,raw:c.raw,message_count:c.messages.length,last_message_at:c.messages.at(-1)?.sent_at||null},{onConflict:'owner_id,telegram_chat_id'}).select('id').single();if(cr.error)throw cr.error;for(const batch of chunk(c.messages,200)){const payload=batch.map(m=>({owner_id:session.user.id,chat_id:cr.data.id,telegram_message_id:m.telegram_message_id,sender_name:m.sender_name,sent_at:m.sent_at,text:m.text,normalized_text:m.text,reply_to_message_id:m.reply_to_message_id,is_service:m.is_service,has_media:m.has_media,media_type:m.media_type}));const mr=await supa.from('telegram_messages').upsert(payload,{onConflict:'owner_id,chat_id,telegram_message_id'});if(mr.error)throw mr.error;imported+=batch.length;}}progress.textContent=`✅ تمام شد — ${fa(chats.length)} گفتگو و ${fa(imported)} پیام وارد شد.`;}catch(err){progress.textContent='❌ خطا: '+(err?.message||String(err))+'\nاگر فایل خیلی بزرگ است، خروجی را ماه‌به‌ماه بگیر؛ پیام‌های تکراری دوباره ذخیره نمی‌شوند.';}finally{file.disabled=false;}};}
boot();
})();
</script>
</body>
</html>
